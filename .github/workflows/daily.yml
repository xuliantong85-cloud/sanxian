# 每个交易日更新数据快照、生成网页并发布到 GitHub Pages
# 时间：周一至周五 23:00 UTC（北京时间次日 7:00），此时美股已收盘约 2 小时
name: 每日更新

on:
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:   # 也可以在 Actions 页面手动运行
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 更新数据并生成网页
        env:
          EODHD_KEY: ${{ secrets.EODHD_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then python build.py; else python update.py; fi

      - name: 保存更新后的快照
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add snap*.txt index.html public/index.html
          git diff --cached --quiet || git commit -m "每日数据更新 $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
